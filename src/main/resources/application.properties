spring.application.name=opora
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
server.error.include-message=never
spring.mvc.problemdetails.enabled=true

spring.datasource.url=${OPORA_DB_URL:jdbc:postgresql://localhost:5432/opora}
spring.datasource.username=${OPORA_DB_USERNAME:opora}
spring.datasource.password=${OPORA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
