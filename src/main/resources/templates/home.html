<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ОПОРА - сила быть собой. Пережить. Осмыслить. Создавать.">
  <title th:text="${projectName}">ОПОРА</title>
  <link rel="stylesheet" href="/css/home.css?v=symbol-preview-v1" th:href="@{/css/home.css(v='symbol-preview-v1')}">
  <script defer src="/js/home.js" th:src="@{/js/home.js}"></script>
</head>
<body>
<main>
  <div class="masthead">
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="/" th:href="@{/}" aria-label="ОПОРА - на главную">
          <span th:text="${projectName}">ОПОРА</span><small>Сила быть собой</small>
        </a>
        <nav class="navigation" aria-label="Основная навигация">
          <a href="#path">Путь</a><span aria-hidden="true">·</span>
          <button type="button" data-section="Практики">Практики</button><span aria-hidden="true">·</span>
          <button type="button" data-section="Библиотека">Библиотека</button>
        </nav>
        <button type="button" class="login" data-section="Войти">Войти</button>
      </div>
    </header>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">Твоя жизнь. Твой выбор.</p>
          <h1 id="hero-title">Какого волка<br>ты кормишь?</h1>
          <p class="intro">Внутри нас есть боль и надежда, страх и мужество. Каждый день мы выбираем, чему давать силу.</p>
          <div class="actions">
            <a class="primary" href="#path">Найти свою опору <span aria-hidden="true">↗</span></a>
            <button type="button" class="symbol-link" id="symbol-open">Смысл символа</button>
          </div>
          <p class="motto" th:text="${projectIdea}">Пережить. Осмыслить. Создавать.</p>
        </div>
        <img class="mobile-wolves" src="/images/approved-wolves.webp" th:src="@{/images/approved-wolves.webp}" width="555" height="605" alt="Два волка в золотом круге на фоне горного рассвета" fetchpriority="high">
      </div>
    </section>
  </div>
  <section class="path" id="path" aria-labelledby="path-title">
    <div class="path-inner">
      <h2 id="path-title">С чего начинается твой путь?</h2>
      <div class="directions">
        <button class="direction" type="button" data-section="Пережить трудное">
          <svg class="direction-icon" width="74" height="57" viewBox="0 0 74 57" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 52 28 13 42 33 52 21 71 52M14 36l14-17 8 12M44 32l8-7 8 13"/></svg>
          <span class="direction-name">Пережить трудное</span>
          <span class="direction-description">Принять реальность, сохранить внутреннюю силу и опору.</span>
          <span class="direction-arrow" aria-hidden="true">→</span>
        </button>
        <button class="direction" type="button" data-section="Вернуть устойчивость">
          <svg class="direction-icon" width="67" height="57" viewBox="0 0 67 57" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="33" cy="28" r="24"/><path d="M33 8v6M33 42v6M13 28h6M47 28h6M25 35l7-16 10-7-7 16-10 7Z"/></svg>
          <span class="direction-name">Вернуть устойчивость</span>
          <span class="direction-description">Восстановить ресурс, ясность и внутреннее равновесие.</span>
          <span class="direction-arrow" aria-hidden="true">→</span>
        </button>
        <button class="direction" type="button" data-section="Найти направление">
          <svg class="direction-icon" width="70" height="57" viewBox="0 0 70 57" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M35 12c-11-7-19-7-29-5v38c12-3 20-1 29 5 9-6 17-8 29-5V7c-10-2-18-2-29 5ZM35 12v38M12 17c7-1 13 1 18 4M12 25c7-1 13 1 18 4M58 17c-7-1-13 1-18 4M58 25c-7-1-13 1-18 4"/></svg>
          <span class="direction-name">Найти направление</span>
          <span class="direction-description">Сформулировать смысл, цели и свой дальнейший путь.</span>
          <span class="direction-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </div>
  </section>
</main>
<dialog id="info-dialog" aria-labelledby="dialog-title">
  <div class="dialog-content">
    <header class="dialog-header"><h2 id="dialog-title">Смысл символа</h2><button type="button" class="dialog-dismiss" aria-label="Закрыть окно">×</button></header>
    <div class="dialog-text" id="dialog-text"></div>
    <form method="dialog"><button type="submit" class="primary">Закрыть</button></form>
  </div>
</dialog>
<template id="symbol-story"><div class="story-heading"><span>THE ONE YOU FEED</span><h3>Тот, кого ты кормишь</h3></div><img class="story-image" src="/images/two-wolves-story.webp" width="1774" height="887" alt="Старейшина-индейец рассказывает внуку притчу о двух волках на фоне гор и леса"><p class="dialog-paragraph">«The one you feed» (Тот, кого ты кормишь) - это визуальная и текстовая отсылка к древней философской притче о двух волках, которая чаще всего приписывается индейцам племени чероки. Глубинный смысл этого образа заключается в идее непрерывной внутренней борьбы и личной ответственности за свой выбор.</p><p class="dialog-paragraph">Вот основные уровни философского значения этого образа:</p><section class="story-section"><h3><span aria-hidden="true">01</span>Двойственность человеческой натуры</h3><p class="dialog-paragraph">Разделенный на две половины волк символизирует то, что внутри каждого человека сосуществуют две противоположные силы. В классической притче один волк олицетворяет зло (гнев, зависть, жадность, страх, эгоизм), а другой - добро (любовь, сострадание, мир, надежду, доброту). Черная и белая половины - это не просто «плохое» и «хорошее», а извечный конфликт между инстинктами и разумом, эго и альтруизмом.</p></section><section class="story-section"><h3><span aria-hidden="true">02</span>Свобода воли и личная ответственность</h3><p class="dialog-paragraph">Надпись «The one you feed» - это кульминация притчи. Когда внук спрашивает деда, какой волк победит, тот отвечает: «Всегда побеждает тот, которого ты кормишь».</p><p class="dialog-paragraph">Философский смысл здесь в том, что человек - это не заложник своих врожденных качеств. Вы не обречены быть злым или добрым по умолчанию. Исход этой внутренней битвы определяете вы сами через свои ежедневные действия, мысли и привычки. Вы обладаете свободой воли, но вместе с ней несете и полную ответственность за то, какая сторона вашей личности будет расти.</p></section><section class="story-section"><h3><span aria-hidden="true">03</span>Метафора «кормления»: сила привычки</h3><p class="dialog-paragraph">«Кормить» волка - значит уделять ему время, внимание и энергию.</p><p class="dialog-paragraph">Если вы постоянно прокручиваете в голове обиды, злитесь на окружающих, завидуете или осуждаете - вы кормите «черного волка», делая эти реакции своей привычкой.</p><p class="dialog-paragraph">Если вы практикуете благодарность, проявляете терпение, учитесь, помогаете другим и следите за своими мыслями - вы кормите «белого волка».</p><p class="dialog-paragraph">Это напоминание о том, что наши мысли и поступки формируют наш характер и нашу реальность.</p></section><section class="story-section"><h3><span aria-hidden="true">04</span>Осознанность в повседневности</h3><p class="dialog-paragraph">Этот значок - не просто логотип, а ежедневный манифест.</p></section><aside class="story-draft">Предварительный просмотр: окончание четвертого раздела отсутствует в доступной истории. Здесь будет продолжение вашего текста.</aside></template>
</body>
</html>
