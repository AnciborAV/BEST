name: Opora build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  opora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
